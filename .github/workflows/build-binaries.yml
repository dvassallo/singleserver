name: build-binaries

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Build Linux binaries
        run: |
          set -eux
          mkdir -p out
          pkg=github.com/dvassallo/singleserver/internal/singleserver
          version="0.0.0-${GITHUB_REF_NAME}"
          ldflags="-X ${pkg}.Version=${version} -X ${pkg}.Commit=${GITHUB_SHA} -X ${pkg}.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "$ldflags" \
              -o "out/singleserver-linux-${arch}" ./cmd/singleserverd
          done
          (cd out && sha256sum singleserver-linux-* > checksums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: singleserver-linux-binaries
          path: out/*
