apps:
  - acme/arcade-games
  - repo: acme/scoreboard
    branch: master
    healthcheck: https://scoreboard.example.com/up
    # Prune old containers, images and build cache after each successful
    # deploy. Never touches volumes. Keeps 2 containers unless set.
    cleanup_after_deploy: true
  - repo: acme/marketing-site
    branch: master
    hosts:
      - marketing.example.com
      - www.marketing.example.com
      - marketing.example.net
      - www.marketing.example.net
    healthcheck: https://marketing.example.com/up
